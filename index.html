<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <title>LER PLACA - 244</title>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
    button,input{font:inherit}
    button{cursor:pointer}

    .camera{position:fixed;inset:0;background:#000;display:flex;flex-direction:column}
    .header{height:58px;flex:none;padding:0 15px;display:flex;align-items:center;justify-content:space-between;background:#090a0c;border-bottom:1px solid #292d33}
    .title{font-size:13px;font-weight:1000;letter-spacing:.8px}
    .close{width:38px;height:38px;border:0;border-radius:50%;background:#24272c;color:#fff;font-size:20px}

    .view{position:relative;flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#000}
    #video{display:block;width:100%;height:100%;object-fit:cover;background:#000}

    .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
    .frame{
      width:78%;max-width:340px;height:30%;min-height:135px;max-height:185px;
      border:3px solid #ff1a1a;border-radius:14px;
      box-shadow:0 0 0 9999px rgba(0,0,0,.38),0 0 25px rgba(255,0,0,.65)
    }
    .instruction{position:absolute;bottom:34px;left:20px;right:20px;text-align:center;color:#fff;font-size:11px;font-weight:800;text-shadow:0 2px 5px #000}

    .message{position:absolute;left:20px;right:20px;top:20px;padding:12px;border-radius:12px;background:#15181c;border:1px solid #e60000;color:#fff;text-align:center;font-size:11px;display:none;z-index:5}
    .message.show{display:block}

    .footer{flex:none;background:#090a0c;padding:12px 20px 24px;display:flex;justify-content:center;align-items:center;gap:14px;border-top:1px solid #292d33}
    .capture{width:72px;height:72px;border-radius:50%;border:5px solid #fff;background:#e60000;box-shadow:0 0 0 5px rgba(255,255,255,.15)}

    .processing{position:absolute;inset:0;background:rgba(0,0,0,.82);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;z-index:20;padding:25px}
    .processing.show{display:flex}
    .processing-box{width:min(340px,100%);background:#15181c;border:1px solid #e60000;border-radius:15px;padding:18px;text-align:center}
    .processing-title{font-size:14px;font-weight:1000}
    .processing-text{margin-top:7px;color:#aeb4bd;font-size:10px}
    .progress{height:5px;background:#2a2e34;border-radius:99px;overflow:hidden;margin-top:14px}
    .progress-bar{height:100%;width:35%;background:#e60000;border-radius:99px;transition:width .25s}

    .confirm{position:absolute;inset:0;background:rgba(0,0,0,.9);display:none;z-index:30;align-items:center;justify-content:center;padding:20px}
    .confirm.show{display:flex}
    .confirm-box{width:min(360px,100%);background:#111419;border:1px solid #30353d;border-radius:16px;padding:17px}
    .confirm-title{font-size:13px;font-weight:1000}
    .confirm-sub{font-size:9px;color:#9ca3af;margin-top:4px;line-height:1.4}
    .plate-input{width:100%;height:50px;margin-top:14px;text-align:center;text-transform:uppercase;letter-spacing:4px;font-size:23px;font-weight:1000;background:#050505;border:1px solid #555d67;border-radius:10px;color:#fff;outline:none}
    .plate-input:focus{border-color:#e60000}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
    .action{height:43px;border-radius:10px;font-weight:900;font-size:11px;border:1px solid #3b4149;background:#24272c;color:#fff}
    .action.primary{background:#e60000;border-color:#ff2222}
  </style>
</head>

<body>
<div class="camera">
  <header class="header">
    <div class="title">📷 LER PLACA</div>
    <button class="close" type="button" onclick="fechar()">×</button>
  </header>

  <main class="view">
    <video id="video" autoplay playsinline muted></video>

    <div class="overlay">
      <div class="frame"></div>
      <div class="instruction">POSICIONE A PLACA DENTRO DA ÁREA VERMELHA</div>
    </div>

    <div id="message" class="message"></div>

    <div id="processing" class="processing">
      <div class="processing-box">
        <div class="processing-title">LENDO PLACA...</div>
        <div id="processingText" class="processing-text">Processando a imagem.</div>
        <div class="progress"><div id="progressBar" class="progress-bar"></div></div>
      </div>
    </div>

    <div id="confirm" class="confirm">
      <div class="confirm-box">
        <div class="confirm-title">CONFIRME A PLACA</div>
        <div id="confirmSub" class="confirm-sub">Confira a leitura antes de consultar o cadastro. Se não for identificada, digite manualmente.</div>
        <input id="plateInput" class="plate-input" maxlength="8" autocomplete="off" spellcheck="false">
        <div class="actions">
          <button class="action" type="button" onclick="refazer()">TIRAR NOVA FOTO</button>
          <button class="action primary" type="button" onclick="enviarPlaca()">CONFIRMAR</button>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <button class="capture" type="button" onclick="capturar()" aria-label="Capturar placa"></button>
  </footer>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const token = params.get("token") || "";

let stream = null;
let trabalhando = false;
let worker = null;

const video = document.getElementById("video");
const message = document.getElementById("message");
const processing = document.getElementById("processing");
const processingText = document.getElementById("processingText");
const progressBar = document.getElementById("progressBar");
const confirmBox = document.getElementById("confirm");
const plateInput = document.getElementById("plateInput");
const confirmSub = document.getElementById("confirmSub");

function mostrarMensagem(texto){
  message.textContent = texto;
  message.classList.add("show");
}

function esconderMensagem(){
  message.textContent = "";
  message.classList.remove("show");
}

async function iniciarCamera(){
  esconderMensagem();

  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    mostrarMensagem("Este navegador não permite acesso à câmera. Abra esta página em HTTPS no Chrome ou Safari.");
    return;
  }

  try{
    stream = await navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{
        facingMode:{ideal:"environment"},
        width:{ideal:1920},
        height:{ideal:1080}
      }
    });

    video.srcObject = stream;
    await video.play();
  }catch(error){
    console.error(error);
    let msg = "Não foi possível acessar a câmera.";
    if(error && error.name === "NotAllowedError") msg = "A câmera foi bloqueada. Permita o acesso à câmera nas configurações do navegador.";
    else if(error && error.name === "NotFoundError") msg = "Nenhuma câmera foi encontrada neste aparelho.";
    else if(error && error.name === "NotReadableError") msg = "A câmera está sendo usada por outro aplicativo.";
    mostrarMensagem(msg);
  }
}

function pararCamera(){
  if(stream){
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }
  video.srcObject = null;
}

function fechar(){
  pararCamera();
  try{
    if(window.opener && !window.opener.closed) window.close();
    else history.back();
  }catch(e){ history.back(); }
}

function normalizarPlaca(texto){
  return String(texto || "").toUpperCase().replace(/[^A-Z0-9]/g,"").trim();
}

function extrairPlaca(texto){
  const limpo = normalizarPlaca(texto);
  const mercosul = limpo.match(/[A-Z]{3}[0-9][A-Z][0-9]{2}/g);
  const antigo = limpo.match(/[A-Z]{3}[0-9]{4}/g);
  if(mercosul && mercosul.length) return mercosul[0];
  if(antigo && antigo.length) return antigo[0];
  return "";
}

function canvasProcessado(source, sx, sy, sw, sh, largura, altura){
  const canvas = document.createElement("canvas");
  canvas.width = largura;
  canvas.height = altura;
  const ctx = canvas.getContext("2d", {willReadFrequently:true});
  ctx.drawImage(source, sx, sy, sw, sh, 0, 0, largura, altura);

  const imageData = ctx.getImageData(0,0,largura,altura);
  const data = imageData.data;
  for(let i=0;i<data.length;i+=4){
    const gray = (data[i]*0.299) + (data[i+1]*0.587) + (data[i+2]*0.114);
    const contrast = Math.max(0,Math.min(255,(gray-128)*1.7+128));
    data[i]=contrast;
    data[i+1]=contrast;
    data[i+2]=contrast;
  }
  ctx.putImageData(imageData,0,0);
  return canvas;
}

function prepararImagens(){
  if(!video.videoWidth || !video.videoHeight) return [];

  const vw = video.videoWidth;
  const vh = video.videoHeight;
  const imagens = [];

  // Enquadramento horizontal para carros.
  {
    const cropWidth = Math.floor(vw * 0.90);
    const cropHeight = Math.floor(vh * 0.48);
    const sx = Math.max(0,Math.floor((vw-cropWidth)/2));
    const sy = Math.max(0,Math.floor((vh-cropHeight)/2));
    imagens.push({nome:"carro",canvas:canvasProcessado(video,sx,sy,cropWidth,cropHeight,1400,500)});
  }

  // Enquadramento mais alto/quadrado para placas de moto.
  {
    const cropWidth = Math.floor(vw * 0.72);
    const cropHeight = Math.floor(vh * 0.78);
    const sx = Math.max(0,Math.floor((vw-cropWidth)/2));
    const sy = Math.max(0,Math.floor((vh-cropHeight)/2));
    imagens.push({nome:"moto",canvas:canvasProcessado(video,sx,sy,cropWidth,cropHeight,1000,850)});
  }

  return imagens;
}

async function criarWorker(){
  if(worker) return worker;

  worker = await Tesseract.createWorker("eng",1,{
    logger: info => {
      if(info && info.status === "recognizing text" && typeof info.progress === "number"){
        const pct = Math.round(info.progress * 45);
        progressBar.style.width = Math.max(30,Math.min(90,30+pct)) + "%";
      }
    }
  });

  await worker.setParameters({
    tessedit_char_whitelist:"ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789",
    preserve_interword_spaces:"0"
  });

  return worker;
}

async function lerImagem(item, psm){
  const ocrWorker = await criarWorker();
  await ocrWorker.setParameters({
    tessedit_pageseg_mode:String(psm),
    tessedit_char_whitelist:"ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789",
    preserve_interword_spaces:"0"
  });
  const resultado = await ocrWorker.recognize(item.canvas);
  return resultado && resultado.data ? String(resultado.data.text || "") : "";
}

async function capturar(){
  if(trabalhando) return;

  if(!video.videoWidth || !video.videoHeight){
    mostrarMensagem("A câmera ainda não está pronta.");
    return;
  }

  trabalhando = true;
  esconderMensagem();
  confirmBox.classList.remove("show");
  processing.classList.add("show");
  progressBar.style.width = "10%";
  processingText.textContent = "Preparando a imagem...";

  try{
    if(typeof Tesseract === "undefined") throw new Error("O mecanismo de leitura não foi carregado.");

    const imagens = prepararImagens();
    if(!imagens.length) throw new Error("Não foi possível capturar a imagem.");

    progressBar.style.width = "25%";
    processingText.textContent = "Testando placa de carro e placa de moto...";

    const resultados = [];

    for(const imagem of imagens){
      try{
        const psm = imagem.nome === "moto" ? Tesseract.PSM.SINGLE_BLOCK : Tesseract.PSM.SINGLE_LINE;
        const texto = await lerImagem(imagem,psm);
        resultados.push(texto);
        const placa = extrairPlaca(texto);
        if(placa){
          progressBar.style.width = "100%";
          plateInput.value = placa;
          confirmSub.textContent = "Confira a leitura antes de consultar o cadastro.";
          processing.classList.remove("show");
          confirmBox.classList.add("show");
          trabalhando = false;
          return;
        }
      }catch(e){
        console.warn("Falha em uma tentativa de OCR:",e);
      }
    }

    // Segunda tentativa com bloco único na imagem da moto, útil para placas quadradas.
    const moto = imagens.find(x => x.nome === "moto");
    if(moto){
      try{
        processingText.textContent = "Tentando outra leitura...";
        progressBar.style.width = "65%";
        const texto = await lerImagem(moto,Tesseract.PSM.SPARSE_TEXT);
        resultados.push(texto);
        const placa = extrairPlaca(texto);
        if(placa){
          progressBar.style.width = "100%";
          plateInput.value = placa;
          confirmSub.textContent = "Confira a leitura antes de consultar o cadastro.";
          processing.classList.remove("show");
          confirmBox.classList.add("show");
          trabalhando = false;
          return;
        }
      }catch(e){
        console.warn("Falha na segunda tentativa:",e);
      }
    }

    processing.classList.remove("show");
    plateInput.value = "";
    confirmSub.textContent = "A leitura automática não identificou a placa. Digite a placa manualmente e confirme.";
    confirmBox.classList.add("show");
    plateInput.focus();
    trabalhando = false;

  }catch(error){
    console.error("Erro no OCR:",error);
    processing.classList.remove("show");
    plateInput.value = "";
    confirmSub.textContent = "Não foi possível identificar automaticamente. Digite a placa manualmente e confirme.";
    confirmBox.classList.add("show");
    plateInput.focus();
    trabalhando = false;
  }
}

function refazer(){
  confirmBox.classList.remove("show");
  plateInput.value = "";
  confirmSub.textContent = "Confira a leitura antes de consultar o cadastro. Se não for identificada, digite manualmente.";
  esconderMensagem();
}

function enviarPlaca(){
  const placa = normalizarPlaca(plateInput.value);

  if(!/^(?:[A-Z]{3}[0-9][A-Z][0-9]{2}|[A-Z]{3}[0-9]{4})$/.test(placa)){
    mostrarMensagem("Informe uma placa válida: ABC1D23 ou ABC1234.");
    return;
  }

  if(window.opener && !window.opener.closed){
    window.opener.postMessage({
      type:"PLACA_CAPTURADA",
      token:token,
      placa:placa
    },"*");

    pararCamera();
    setTimeout(function(){try{window.close();}catch(e){}},150);
  }else{
    plateInput.value = placa;
    mostrarMensagem("Janela principal não encontrada. Use a placa acima no aplicativo.");
  }
}

window.addEventListener("pagehide",pararCamera);
window.addEventListener("beforeunload",pararCamera);

iniciarCamera();
</script>
</body>
</html>
